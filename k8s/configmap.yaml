apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-config
  namespace: dify
data:
  # API URLs
  CONSOLE_API_URL: ""
  CONSOLE_WEB_URL: ""
  SERVICE_API_URL: ""
  APP_API_URL: ""
  APP_WEB_URL: ""
  FILES_URL: ""
  
  # Logging
  LOG_LEVEL: "INFO"
  LOG_FILE: ""  # 留空输出到 stdout，由 K8s 日志系统收集
  LOG_FILE_MAX_SIZE: "20"
  LOG_FILE_BACKUP_COUNT: "5"
  LOG_DATEFORMAT: "%Y-%m-%d %H:%M:%S"
  LOG_TZ: "UTC"
  
  # Debug
  DEBUG: "false"
  FLASK_DEBUG: "false"
  DEPLOY_ENV: "PRODUCTION"
  CHECK_UPDATE_URL: ""
  
  # OpenAI
  OPENAI_API_BASE: "https://api.openai.com/v1"
  
  # Migration
  MIGRATION_ENABLED: "true"
  
  # Timeouts and Limits
  FILES_ACCESS_TIMEOUT: "300"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  APP_MAX_ACTIVE_REQUESTS: "0"
  APP_MAX_EXECUTION_TIME: "1200"
  
  # Server Config
  DIFY_BIND_ADDRESS: "0.0.0.0"
  DIFY_PORT: "5001"
  SERVER_WORKER_AMOUNT: "1"
  SERVER_WORKER_CLASS: "gevent"
  SERVER_WORKER_CONNECTIONS: "10"
  GUNICORN_TIMEOUT: "360"
  
  # Celery Config
  CELERY_AUTO_SCALE: "false"
  
  # API Tool Timeouts
  API_TOOL_DEFAULT_CONNECT_TIMEOUT: "10"
  API_TOOL_DEFAULT_READ_TIMEOUT: "60"
  
  # Database Config
  DB_USERNAME: "postgres"
  DB_HOST: "10.0.18.83" # 替换为你的数据库主机地址
  DB_PORT: "5432"
  DB_DATABASE: "dify"
  SQLALCHEMY_POOL_SIZE: "30"
  SQLALCHEMY_POOL_RECYCLE: "3600"
  SQLALCHEMY_ECHO: "false"
  
  # Redis Config
  REDIS_HOST: "10.0.18.83" # 替换为你的 Redis 主机地址
  REDIS_PORT: "6379"
  REDIS_USE_SSL: "false"
  REDIS_DB: "0"
  REDIS_USE_SENTINEL: "false"
  REDIS_USE_CLUSTERS: "false"
  
  # Celery Broker
  CELERY_BROKER_URL: "redis://:difyai123456@10.0.18.83:6379/1" # 替换为你的 Redis 主机地址和密码
  BROKER_USE_SSL: "false"
  CELERY_USE_SENTINEL: "false"
  
  # CORS
  WEB_API_CORS_ALLOW_ORIGINS: "*"
  CONSOLE_CORS_ALLOW_ORIGINS: "*"
  
  # Storage
  STORAGE_TYPE: "aliyun-oss"
  OPENDAL_SCHEME: "oss"
  OPENDAL_FS_ROOT: "storage"
  S3_REGION: "us-east-1"
  S3_BUCKET_NAME: "difyai"
  S3_USE_AWS_MANAGED_IAM: "false"
  
  # Aliyun OSS
  ALIYUN_OSS_BUCKET_NAME: "wy-dify-k8s" # 替换为你的 OSS Bucket 名称
  ALIYUN_OSS_ENDPOINT: "https://oss-cn-shenzhen.aliyuncs.com"
  ALIYUN_OSS_REGION: "cn-shenzhen"
  ALIYUN_OSS_AUTH_VERSION: "v4"
  ALIYUN_OSS_PATH: "dify"
  
  # Vector Store
  VECTOR_STORE: "weaviate"
  WEAVIATE_ENDPOINT: "http://10.0.18.83:8180" # 替换为你的 Weaviate 主机地址
  
  # Upload Limits
  UPLOAD_FILE_SIZE_LIMIT: "15"
  UPLOAD_FILE_BATCH_LIMIT: "5"
  UPLOAD_IMAGE_FILE_SIZE_LIMIT: "10"
  UPLOAD_VIDEO_FILE_SIZE_LIMIT: "100"
  UPLOAD_AUDIO_FILE_SIZE_LIMIT: "50"
  
  # ETL
  ETL_TYPE: "dify"
  
  # Analytics
  SCARF_NO_ANALYTICS: "true"
  
  # Token Limits
  PROMPT_GENERATION_MAX_TOKENS: "512"
  CODE_GENERATION_MAX_TOKENS: "1024"
  
  # Multimodal
  MULTIMODAL_SEND_FORMAT: "base64"
  
  # Sentry
  API_SENTRY_TRACES_SAMPLE_RATE: "1.0"
  API_SENTRY_PROFILES_SAMPLE_RATE: "1.0"
  
  # Notion
  NOTION_INTEGRATION_TYPE: "public"
  
  # Mail
  MAIL_TYPE: "resend"
  RESEND_API_URL: "https://api.resend.com"
  
  # Indexing
  INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: "4000"
  
  # Invite
  INVITE_EXPIRY_HOURS: "72"
  RESET_PASSWORD_TOKEN_EXPIRY_MINUTES: "5"
  
  # Code Execution
  CODE_EXECUTION_ENDPOINT: "http://sandbox:8194"
  CODE_MAX_NUMBER: "9223372036854775807"
  CODE_MIN_NUMBER: "-9223372036854775808"
  CODE_MAX_DEPTH: "5"
  CODE_MAX_PRECISION: "20"
  CODE_MAX_STRING_LENGTH: "80000"
  CODE_MAX_STRING_ARRAY_LENGTH: "30"
  CODE_MAX_OBJECT_ARRAY_LENGTH: "30"
  CODE_MAX_NUMBER_ARRAY_LENGTH: "1000"
  CODE_EXECUTION_CONNECT_TIMEOUT: "10"
  CODE_EXECUTION_READ_TIMEOUT: "60"
  CODE_EXECUTION_WRITE_TIMEOUT: "10"
  
  # Template
  TEMPLATE_TRANSFORM_MAX_LENGTH: "80000"
  
  # Workflow
  WORKFLOW_MAX_EXECUTION_STEPS: "500"
  WORKFLOW_MAX_EXECUTION_TIME: "1200"
  WORKFLOW_CALL_MAX_DEPTH: "5"
  MAX_VARIABLE_SIZE: "204800"
  WORKFLOW_PARALLEL_DEPTH_LIMIT: "3"
  WORKFLOW_FILE_UPLOAD_LIMIT: "10"
  
  # HTTP Request Node
  HTTP_REQUEST_NODE_MAX_BINARY_SIZE: "10485760"
  HTTP_REQUEST_NODE_MAX_TEXT_SIZE: "1048576"
  
  # SSRF Proxy
  SSRF_PROXY_HTTP_URL: "http://ssrf-proxy:3128"
  SSRF_PROXY_HTTPS_URL: "http://ssrf-proxy:3128"
  
  # Text Generation
  TEXT_GENERATION_TIMEOUT_MS: "60000"
  
  # Sandbox
  SANDBOX_GIN_MODE: "release"
  SANDBOX_WORKER_TIMEOUT: "15"
  SANDBOX_ENABLE_NETWORK: "true"
  SANDBOX_HTTP_PROXY: "http://ssrf-proxy:3128"
  SANDBOX_HTTPS_PROXY: "http://ssrf-proxy:3128"
  SANDBOX_PORT: "8194"
  
  # Weaviate
  WEAVIATE_PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
  WEAVIATE_QUERY_DEFAULTS_LIMIT: "25"
  WEAVIATE_AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
  WEAVIATE_DEFAULT_VECTORIZER_MODULE: "none"
  WEAVIATE_CLUSTER_HOSTNAME: "node1"
  WEAVIATE_AUTHENTICATION_APIKEY_ENABLED: "true"
  WEAVIATE_AUTHENTICATION_APIKEY_USERS: "hello@dify.ai"
  WEAVIATE_AUTHORIZATION_ADMINLIST_ENABLED: "true"
  WEAVIATE_AUTHORIZATION_ADMINLIST_USERS: "hello@dify.ai"
  
  # Other
  CREATE_TIDB_SERVICE_JOB_ENABLED: "false"
  MAX_SUBMIT_COUNT: "100"
  TOP_K_MAX_VALUE: "10"
  NEXT_TELEMETRY_DISABLED: "0"

  # Plugin daemon
  DB_PLUGIN_DATABASE: "dify_plugin"
  PLUGIN_DAEMON_PORT: "5002"
  PLUGIN_DAEMON_URL: "http://plugin-daemon:5002"
  PLUGIN_MAX_PACKAGE_SIZE: "52428800"
  PLUGIN_PPROF_ENABLED: "false"
  PLUGIN_DIFY_INNER_API_URL: "http://api:5001"
  PLUGIN_DEBUGGING_HOST: "0.0.0.0"
  PLUGIN_DEBUGGING_PORT: "5003"
  PLUGIN_PYTHON_ENV_INIT_TIMEOUT: "120"
  PLUGIN_MAX_EXECUTION_TIMEOUT: "600"
  PLUGIN_STDIO_BUFFER_SIZE: "1024"
  PLUGIN_STDIO_MAX_BUFFER_SIZE: "5242880"
  PLUGIN_STORAGE_TYPE: "aliyun_oss"
  PLUGIN_STORAGE_LOCAL_ROOT: "/app/storage"
  PLUGIN_WORKING_PATH: "/app/storage/cwd"
  PLUGIN_INSTALLED_PATH: "plugin"
  PLUGIN_PACKAGE_CACHE_PATH: "plugin_packages"
  PLUGIN_MEDIA_CACHE_PATH: "assets"
  PLUGIN_ALIYUN_OSS_REGION: "cn-shenzhen"
  PLUGIN_ALIYUN_OSS_ENDPOINT: "https://oss-cn-shenzhen.aliyuncs.com"
  PLUGIN_ALIYUN_OSS_PATH: "dify"
  PLUGIN_ALIYUN_OSS_AUTH_VERSION: "v4"
  PLUGIN_STORAGE_OSS_BUCKET: "wy-dify-k8s" # 替换为你的 OSS Bucket 名称
  ENDPOINT_URL_TEMPLATE: "http://localhost/e/{hook_id}"
  MARKETPLACE_ENABLED: "true"
  MARKETPLACE_API_URL: "https://marketplace.dify.ai"
  FORCE_VERIFYING_SIGNATURE: "true"
  ENFORCE_LANGGENIUS_PLUGIN_SIGNATURES: "true"
  PLUGIN_DAEMON_TIMEOUT: "600.0"
  PIP_MIRROR_URL: ""