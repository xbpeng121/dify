apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-daemon
  namespace: dify
  labels:
    app: plugin-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plugin-daemon
  template:
    metadata:
      labels:
        app: plugin-daemon
    spec:
      containers:
      - name: plugin-daemon
        image: 192.168.40.224/dify/langgenius/dify-plugin-daemon:0.5.2-local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
          name: http
        env:        
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: DB_PLUGIN_DATABASE
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_DAEMON_PORT
        - name: SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_DAEMON_KEY
        - name: MAX_PLUGIN_PACKAGE_SIZE
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_MAX_PACKAGE_SIZE
        - name: PPROF_ENABLED
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_PPROF_ENABLED
        - name: DIFY_INNER_API_URL
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_DIFY_INNER_API_URL
        - name: DIFY_INNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_DIFY_INNER_API_KEY     
        - name: PLUGIN_REMOTE_INSTALLING_HOST
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_DEBUGGING_HOST
        - name: PLUGIN_REMOTE_INSTALLING_PORT
          valueFrom:
            configMapKeyRef:
              name: dify-config              
              key: PLUGIN_DEBUGGING_PORT
        - name: PYTHON_ENV_INIT_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_PYTHON_ENV_INIT_TIMEOUT
        - name: ALIYUN_OSS_REGION
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_ALIYUN_OSS_REGION
        - name: ALIYUN_OSS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_ALIYUN_OSS_ENDPOINT
        - name: ALIYUN_OSS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_ALIYUN_OSS_ACCESS_KEY_ID
        - name: ALIYUN_OSS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: dify-secrets
              key: PLUGIN_ALIYUN_OSS_ACCESS_KEY_SECRET
        - name: ALIYUN_OSS_PATH
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_ALIYUN_OSS_PATH
        - name: ALIYUN_OSS_AUTH_VERSION
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_ALIYUN_OSS_AUTH_VERSION
        - name: ALIYUN_OSS_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: dify-config
              key: PLUGIN_STORAGE_OSS_BUCKET
        envFrom:
        - configMapRef:
            name: dify-config
        - secretRef:
            name: dify-secrets
        volumeMounts:
        - name: plugin-storage
          mountPath: /app/storage
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: plugin-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-daemon
  namespace: dify
  labels:
    app: plugin-daemon
spec:
  type: ClusterIP
  ports:
  - port: 5002
    targetPort: 5002
    protocol: TCP
    name: http
  - port: 5003
    targetPort: 5003
    protocol: TCP
    name: debug-port
  selector:
    app: plugin-daemon